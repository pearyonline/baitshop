    <h1 class="intro">Looking to contact us?</h1>

    <div class="contact">
        <form>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Phone number</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="123-456-7890">
              </div>
              <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Message</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"placeholder="Message goes here"></textarea></textarea>
              </div>
              <h4 class="intro">Got any cool catches to show us?</h1>
              <div class="mb-3">
                <label for="formFileMultiple" class="form-label">Attach them here!</label>
                <input class="form-control" type="file" id="formFileMultiple" multiple>
              </div>
            <a href="thanks.html" type="submit" class="btn btn-primary">Submit</a>
          </form>
        </div>
    </div>
